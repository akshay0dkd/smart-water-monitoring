# ============================================================
# APPLICATION CONFIGURATION
# Smart Water Usage Monitoring and Automated Billing Platform
# ============================================================

spring.application.name=smart-water-monitoring

# ============================================================
# DATASOURCE CONFIGURATION
# ============================================================

spring.datasource.url=jdbc:postgresql://localhost:5432/smart_water_monitoring
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================

# Schema is managed by Flyway — do NOT use create/update/create-drop
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# FLYWAY CONFIGURATION
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ============================================================
# SERVER CONFIGURATION
# ============================================================

server.port=8080
